[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-therapy-simulator"
version = "0.1.0"
description = "Evidence-first educational neurodiversity simulation lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.48",
  "openai>=2.0",
  "pydantic>=2.10",
  "pandas>=2.2",
  "plotly>=5.24",
  "python-dotenv>=1.0",
  "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
